    <style>
      body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
        background-color: #f8fafc; /* Slate-50 */
        background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Focus States for Accessibility */
      :focus-visible {
        outline: 3px solid #6366f1;
        outline-offset: 2px;
      }

      /* GLASSMORPHISM */
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.02), 
          0 2px 4px -1px rgba(0, 0, 0, 0.02),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* 3D KEY STYLES */
      .key-3d {
        transform: translateY(0);
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 
          0 4px 0 0 #1e293b, /* Slate-800 for depth */
          0 6px 6px rgba(0,0,0,0.15);
      }
      
      .key-3d:active, .key-3d.active-press {
        transform: translateY(4px);
        box-shadow: 
          0 0 0 0 #1e293b,
          0 0 2px rgba(0,0,0,0.1);
      }

      .key-3d-active {
        background-color: #6366f1 !important; /* Indigo-500 */
        color: white !important;
        border-color: #4f46e5 !important; /* Indigo-600 */
        box-shadow: 
          0 4px 0 0 #3730a3, /* Indigo-800 */
          0 6px 12px rgba(99, 102, 241, 0.4) !important;
      }
      
      .key-3d-active:active, .key-3d-active.active-press {
        transform: translateY(4px);
        box-shadow: 0 0 0 0 #3730a3 !important;
      }

      /* ANIMATIONS */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
      
      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
      }
      .animate-pop {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Custom Scrollbar for Sidebar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: #94a3b8;
      }

      /* PRINT ENGINE V2 */
      @media print {
        @page { margin: 1cm; size: A4; }
        body { background: white !important; color: black !important; background-image: none !important; }
        header, aside, .no-print, #keyboard-section, footer, .quiz-overlay, .copy-btn { display: none !important; }
        main { padding: 0 !important; margin: 0 !important; width: 100% !important; display: block !important; }
        .print-header { display: block !important; border-bottom: 2px solid black; padding-bottom: 1rem; margin-bottom: 1rem; }
        .grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 1rem !important; }
        .shortcut-card { break-inside: avoid; border: 1px solid #ccc !important; background: white !important; box-shadow: none !important; padding: 0.8rem !important; }
        kbd { border: 1px solid #999 !important; background: #eee !important; color: black !important; box-shadow: none !important; }
        .mastered-badge { display: none !important; }
      }
      .print-header { display: none; }
